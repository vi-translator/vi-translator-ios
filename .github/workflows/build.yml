# Every push and pull request: the native libraries (the shared core and chiaki-ng, side by side,
# cached by their sources), then the unit tests in the iOS Simulator, the app for iPhones
# (unsigned), and the app run in the Simulator as an iPhone and an iPad (screenshots, and a
# stand-in TV it must feed).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # (the TestFlight workflow runs all of it first)
  workflow_call:

permissions:
  contents: read

env:
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: The shared core's commit
        id: core
        run: echo "ref=$(grep -v '^#' core.ref | grep -v '^$' | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: The shared core (cached by its commit)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            Frameworks/ViTranslatorCore.xcframework
            native/build/core-swift
          key: core-ios-${{ steps.core.outputs.ref }}-${{ hashFiles('native/build-core.sh') }}

      - name: Build the shared core
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          native/build-core.sh

      - name: The core's Swift bindings in the repository match its library
        run: |
          cp native/build/core-swift/ViTranslatorCore.swift App/Core/Generated/ViTranslatorCore.swift
          git diff --exit-code -- App/Core/Generated/ || {
            echo "::error::App/Core/Generated/ViTranslatorCore.swift differs from the core's at core.ref: commit the copied file"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: core-xcframework
          path: Frameworks
          retention-days: 3

  chiaki:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: The chiaki-ng commit
        id: chiaki
        run: echo "sha=$(git -C third-party/chiaki-ng rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: PS Remote Play (cached by its sources)
        id: cache
        uses: actions/cache@v4
        with:
          path: Frameworks/VitChiaki.xcframework
          key: chiaki-ios-${{ steps.chiaki.outputs.sha }}-${{ hashFiles('native/CMakeLists.txt', 'native/build-chiaki.sh', 'native/shim/**', 'native/cmake/**') }}

      - name: Build PS Remote Play
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja protobuf || true
          native/build-chiaki.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiaki-logs
          path: native/build/*.log
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-xcframework
          path: Frameworks
          retention-days: 3

  app:
    needs: [core, chiaki]
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-xcframework"
          path: Frameworks
          merge-multiple: true

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          xcodebuild -version
          ls Frameworks
          brew install xcodegen || true

      - name: The Xcode project
        run: xcodegen generate

      - name: Unit tests (iPhone Simulator)
        run: |
          SIM=$(python3 ci/pick-sim.py iPhone)
          echo "simulator: $SIM"
          mkdir -p build
          xcodebuild test -project VITranslator.xcodeproj -scheme VITranslator \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build/dd \
            -resultBundlePath build/tests.xcresult CODE_SIGNING_ALLOWED=NO > build/test.log 2>&1
          STATUS=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " build/test.log | head -n 200
          exit $STATUS

      - name: The app for iPhones and iPads (unsigned)
        run: |
          xcodebuild build -project VITranslator.xcodeproj -scheme VITranslator -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build/dd-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build/device.log 2>&1
          STATUS=$?
          grep -E "error:|\*\* " build/device.log | head -n 100
          [ $STATUS -eq 0 ] || exit $STATUS
          mkdir -p build/ipa/Payload
          cp -R build/dd-device/Build/Products/Release-iphoneos/VITranslator.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../VITranslator-unsigned.ipa Payload)
          ls -la build/VITranslator-unsigned.ipa

      - name: Run in the Simulator (iPhone and iPad), with a stand-in TV
        run: ci/run-simulator.sh build/dd/Build/Products/Debug-iphonesimulator/VITranslator.app build/sim

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: |
            build/sim
            build/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VITranslator-unsigned-ipa
          path: build/VITranslator-unsigned.ipa
